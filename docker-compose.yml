services:
  travelo-database:
    image: localhost:5000/travelo-database:1.0
    container_name: travelo-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-chaima2003}
      MYSQL_DATABASE: travelo_db
    volumes:
      - travelo_mysql_data:/var/lib/mysql
    networks: [travelo_net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-chaima2003}"]
      interval: 10s
      timeout: 5s
      retries: 10

  travelo-backend:
    image: localhost:5000/travelo-backend:1.0
    build: ./travelo_backend
    container_name: travelo-backend
    restart: unless-stopped
    depends_on:
      travelo-database:
        condition: service_healthy
    environment:
      DB_HOST: travelo-database
      DB_PASSWORD: ${DB_PASSWORD:-chaima2003}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]
    networks: [travelo_net]

  travelo-frontend:
    image: localhost:5000/travelo-frontend:1.0
    build:
      context: ./travelo_frontend
      args:
        REACT_APP_API_URL: http://localhost:8080
    container_name: travelo-frontend
    restart: unless-stopped
    depends_on: [travelo-backend]
    ports: ["3000:3000"]
    networks: [travelo_net]

networks:
  travelo_net:
    driver: bridge

volumes:
  travelo_mysql_data:
