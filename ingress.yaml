apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: travelo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
    - host: api.travelo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: travelo-backend
                port:
                  number: 8080