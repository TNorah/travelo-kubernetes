worker_processes auto;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name frontend.exam.local;
        location / {
            set $front http://travelo-frontend:3000;
            proxy_pass $front;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
    server {
        listen 80;
        server_name backend.exam.local;
        location / {
            set $back http://travelo-backend:8080;
            proxy_pass $back;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

# MySQL n'est pas du HTTP : proxy TCP (module stream)
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 3306;
        set $db travelo-database:3306;
        proxy_pass $db;
    }
}