version: "3.8"

services:
  travelo-database:
    image: localhost:5000/travelo-database:1.0
    environment:
      MYSQL_ROOT_PASSWORD: chaima2003
      MYSQL_DATABASE: travelo_db
    networks: [travelo_overlay]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 768M }
        reservations: { cpus: "0.25", memory: 384M }
      restart_policy: { condition: any, delay: 5s }

  travelo-backend:
    image: localhost:5000/travelo-backend:1.0
    environment:
      DB_HOST: travelo-database
      DB_PASSWORD: chaima2003
      APP_CORS_ALLOWED_ORIGINS: http://frontend.exam.local
    networks: [travelo_overlay]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/hello || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "0.75", memory: 512M }
        reservations: { cpus: "0.25", memory: 256M }
      restart_policy: { condition: any, delay: 5s }

  travelo-frontend:
    image: localhost:5000/travelo-frontend:1.0
    networks: [travelo_overlay]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "0.50", memory: 256M }
        reservations: { cpus: "0.10", memory: 64M }
      restart_policy: { condition: any, delay: 5s }

  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "3306:3306"
    configs:
      - source: nginx_proxy
        target: /etc/nginx/nginx.conf
    networks: [travelo_overlay]
    deploy:
      replicas: 1
      resources:
        limits: { cpus: "0.25", memory: 64M }
      restart_policy: { condition: any, delay: 5s }

configs:
  nginx_proxy:
    file: ./nginx-proxy.conf

networks:
  travelo_overlay:
    driver: overlay